[project]
name = "codecompass"
version = "0.1.0"
description = "Code intelligence engine - a mini Sourcegraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "typer[all]>=0.9",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.2",
    "tree-sitter>=0.21",
    "tree-sitter-languages>=1.9,<1.11",
    "sentence-transformers>=2.5",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
]

[project.scripts]
codecompass = "codecompass.cli:app"

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20"]
ignore = ["E501", "B008"]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"