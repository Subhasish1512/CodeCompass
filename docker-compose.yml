version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codecompass-postgres
    environment:
      POSTGRES_DB: codecompass
      POSTGRES_USER: codecompass
      POSTGRES_PASSWORD: codecompass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecompass -d codecompass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: