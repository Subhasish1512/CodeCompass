name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://codecompass:codecompass@localhost:5432/codecompass
  PYTHONPATH: /github/workspace/src

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install ruff

      - name: Run ruff check
        run: ruff check src/

      - name: Run ruff format check
        run: ruff format --check src/

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codecompass
          POSTGRES_PASSWORD: codecompass
          POSTGRES_DB: codecompass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U codecompass -d codecompass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install httpx

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U codecompass -d codecompass; then
              echo "Database ready"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database not ready after 60s"
          exit 1

      - name: Run migrations
        run: uv run python -m codecompass.db.migrate migrate

      - name: Index demo repository
        run: |
          uv run python -m codecompass index samples/demo_repo --name demo_repo

      - name: Start API server
        run: |
          uv run uvicorn codecompass.api.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          sleep 5
          echo $SERVER_PID > server.pid

      - name: Test /health endpoint
        run: |
          curl -sf http://localhost:8000/api/v1/health | jq -e '.status == "ok"'

      - name: Test /callers endpoint
        run: |
          # Get a symbol ID from the demo repo
          SYMBOL_ID=$(curl -sf "http://localhost:8000/api/v1/search/definition?name=main&repository_id=1" | jq -r '.[0].id // empty')
          if [ -n "$SYMBOL_ID" ]; then
            curl -sf "http://localhost:8000/api/v1/symbols/$SYMBOL_ID/callers" | jq -e 'length >= 0'
          else
            echo "No symbols found, skipping callers test"
          fi

      - name: Stop API server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi